<!-- =========================================================
YouTube Queue Online — v01.6.1
Ngày cập nhật: 17/10/2025
Loại cập nhật: UI Neumorphism (chỉ thay đổi hiển thị)
Cập nhật thêm:
- Tái bố cục phần Settings: Submit limit (seconds) + Save settings trên cùng 1 hàng
- Tách cụm Logo thành khối riêng, đặt sau Queue
- Giữ nguyên toàn bộ phần khác
========================================================= -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ app_title }} - Host</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div class="max-w-7xl mx-auto p-6 stack">
    <!-- Header -->
    <div class="flex items-center gap-4">
      {% if logo_url %}
      <div class="neu-pill p-2">
        <img src="{{ logo_url }}" class="h-8 w-8 rounded-md" alt="logo">
      </div>
      {% endif %}
      <h1 class="text-3xl font-bold">{{ app_title }} — Host</h1>
    </div>

    <!-- Control bar -->
    <div class="neu-card section">
      <h2 class="font-semibold mb-3">⚙️ YouTube Queue Control — Options</h2>
      <div class="flex flex-wrap items-center gap-3">
        <button id="btnPrev" class="neu-btn">⏮ Prev</button>
        <button id="btnPlay" class="neu-btn neu-btn-primary">▶ Start</button>
        <button id="btnNext" class="neu-btn">⏭ Next</button>
        <button id="btnClear" class="neu-btn">🗑 Clear</button>
      </div>
      <div id="actionStatus" class="small mt-2"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Left: Player + Queue -->
      <div class="lg:col-span-2 stack">
        <!-- Player -->
        <div class="neu-card section">
          <h2 class="font-semibold mb-3">Now Playing</h2>
          <div class="relative">
            <div id="player" class="w-full aspect-video rounded-2xl overflow-hidden bg-black"></div>
            <div id="countdown" class="countdown-badge hidden">3</div>
          </div>
        </div>

        <!-- Queue -->
        <div class="neu-card section">
          <h2 class="font-semibold mb-3">Queue</h2>
          <div id="queue" class="list">
            <!-- host.js render items -->
          </div>
        </div>
      </div>

      <!-- Right: Settings + History -->
      <div class="stack">
        <!-- System Settings -->
        <div class="neu-card section stack">
          <h2 class="font-semibold mb-2">System Settings</h2>
          <div class="flex items-center gap-4">
            <label class="text-sm text-gray-600 whitespace-nowrap">Submit limit (seconds)</label>
            <input id="rate" type="number" min="10" step="10" class="neu-inset px-3 py-2 w-24">
            <button id="btnSaveCfg" class="neu-btn neu-btn-primary">Save settings</button>
          </div>
        </div>

        <!-- Recent history -->
        <div class="neu-card section">
          <h2 class="font-semibold mb-3">Recent history</h2>
          <div id="history" class="list"></div>
        </div>
      </div>
    </div>

    <!-- Logo Settings -->
    <div class="neu-card section mt-6">
      <h2 class="font-semibold mb-3">Logo Settings</h2>
      <div class="stack">
        <label class="small">Logo (png/jpg/gif)</label>
        <input id="logo" type="file" accept=".png,.jpg,.jpeg,.gif" class="neu-btn-light w-full">
        <button id="btnLogo" class="neu-btn">Upload</button>
      </div>
    </div>
  </div>

  <script>
    const HOST_KEY = "{{ host_key }}";
  </script>
  <script src="/static/host.js"></script>
</body>
</html>
